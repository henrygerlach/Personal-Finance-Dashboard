<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Sign in · Personal Finance Dashboard</title>
    <link rel="stylesheet" href="{{ static_url('styles.css') }}" />
  </head>
  <body>
    <main class="auth-page">
      {% if mode == "signup" %}
      <form class="auth-card" method="post" action="/signup">
        <h1>Create account</h1>
        {% if error %}
        <p class="field-note">{{ error }}</p>
        {% endif %}
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="form-actions">
          <a class="ghost-button" href="/login?next={{ next }}">Sign in instead</a>
          <button type="submit" class="primary-button">Create account</button>
        </div>
      </form>
      {% else %}
      <form class="auth-card" method="post" action="/login">
        <h1>Sign in</h1>
        {% if error %}
        <p class="field-note">{{ error }}</p>
        {% endif %}
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="form-actions">
          <a class="ghost-button" href="/login?mode=signup&next={{ next }}"
            >Create account</a
          >
          <button type="submit" class="primary-button">Sign in</button>
        </div>
      </form>
      {% endif %}
    </main>
  </body>
</html>
