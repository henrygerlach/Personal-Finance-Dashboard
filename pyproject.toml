# --- Poetry Configuration ---
[tool.poetry]
name = "personal-finance-dashboard"
version = "0.1.0"
description = "Turns Comdirect CSV exports into a categorised ledger — LLM classification behind a merchant cache, recurring-payment and trip detection, 840 tests at 97% coverage"
authors = ["Henry Gerlach <150011457+henrygerlach@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pandas = "^2.2.0"
beanie = "^1.25.0"
motor = "^3.3.2"
python-multipart = "^0.0.7"
pydantic-settings = "^2.1.0"
anthropic = "^1.0.0"
jinja2 = "^3.1.3"
# Optional, and named by an SSH remote to a private repository. Nothing
# outside ComdirectBalanceService imports it, and that import is inside the
# method rather than at module scope, so the app, the scripts and the whole
# test suite run without it. Keeping it out of the default install is what
# lets CI install this project with no credentials for that repository.
comdirect-rest-api = { git = "git@github.com:henrygerlach/Comdirect-REST-API.git", branch = "main", optional = true }

# Installed by `mise run install`, which passes --all-extras. A developer who
# wants the live account balances needs this; nothing else does.
[tool.poetry.extras]
comdirect = ["comdirect-rest-api"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.2.0"
pytest = "^8.0.0"
mypy = "^1.8.0"
ipykernel = "^7.2.0"
pytest-cov = "^7.1.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (F), Errors (E), and Isort (I)
select = ["F", "E", "W", "I", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"