# --- Poetry Configuration ---
[tool.poetry]
name = "comdirect-dashboard"
version = "0.1.0"
description = "Full-stack bank transaction categorizer and dashboard"
authors = ["Henry Gerlach <150011457+henrygerlach@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pandas = "^2.2.0"
beanie = "^1.25.0"
motor = "^3.3.2"
python-multipart = "^0.0.7"
pydantic-settings = "^2.1.0"
jinja2 = "^3.1.3"
comdirect-rest-api = { git = "git@github.com:henrygerlach/Comdirect-REST-API.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
ruff = "^0.2.0"
pytest = "^8.0.0"
mypy = "^1.8.0"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (F), Errors (E), and Isort (I)
select = ["F", "E", "W", "I", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"